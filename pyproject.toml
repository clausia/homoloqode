[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homoloqode"
version = "0.1.0"
description = "Construct homological CSS codes from finite chain complexes."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
authors = [
    { name = "Claudia Zendejas-Morales" },
    { name = "Amey Joshi" },
]
dependencies = [
    "jupyter>=1.1",
    "numpy>=2.5",
    "qiskit[visualization]>=2.5",
    "pytest>=9.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
