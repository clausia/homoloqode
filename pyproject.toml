[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homoloqode"
version = "0.1.0"
description = "Construct homological CSS codes from finite chain complexes."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Claudia Zendejas-Morales" },
    { name = "Amey Joshi" },
]
dependencies = [
    "numpy>=1.26",
]

[project.optional-dependencies]
qiskit = [
    "qiskit>=2.0",
]
test = [
    "pytest>=8",
]
dev = [
    "qiskit>=2.0",
    "pytest>=8",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
