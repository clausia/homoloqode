name: Tests and notebooks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python 3.12 on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    env:
      MPLBACKEND: Agg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade packaging tools
        run: python -m pip install --upgrade pip setuptools wheel

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Display installed versions
        run: |
          python --version
          python -m pip show homoloqode numpy matplotlib qiskit pytest coverage jupyter ipykernel nbconvert

      - name: Run test suite with coverage
        run: |
          python -m coverage run -m pytest
          python -m coverage report

      - name: Register notebook kernel
        run: >-
          python -m ipykernel install --user
          --name homoloqode
          --display-name "Python (homoloqode)"

      - name: Execute committed notebooks
        run: >-
          python -m jupyter nbconvert
          --to notebook
          --execute
          --ExecutePreprocessor.timeout=180
          --output-dir=executed-notebooks
          notebooks/*.ipynb
